<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Oh Story">
  <title>Oh Story</title>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1f2d3d"/>
  <!-- 摊开的书页：左页 + 右页，中缝留白 -->
  <path d="M12 18h16a4 4 0 0 1 4 4v24a4 4 0 0 0-4-4H12z" fill="#f4ece0"/>
  <path d="M52 18H36a4 4 0 0 0-4 4v24a4 4 0 0 1 4-4h16z" fill="#e8dcc8"/>
  <!-- 页面上的一行行字 -->
  <g fill="#1f2d3d" opacity="0.55">
    <rect x="16" y="25" width="12" height="2" rx="1"/>
    <rect x="16" y="30" width="12" height="2" rx="1"/>
    <rect x="16" y="35" width="9" height="2" rx="1"/>
    <rect x="36" y="25" width="12" height="2" rx="1"/>
    <rect x="36" y="30" width="12" height="2" rx="1"/>
    <rect x="36" y="35" width="9" height="2" rx="1"/>
  </g>
  <!-- 书脊 -->
  <rect x="30" y="18" width="4" height="28" rx="2" fill="#c9a227"/>
  <!-- 底部的笔尖，表示「写」 -->
  <path d="M32 44l4 8-4 6-4-6z" fill="#c9a227"/>
</svg>
